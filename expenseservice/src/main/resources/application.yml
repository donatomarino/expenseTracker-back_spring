app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 10800000

server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL_SPENDINGS}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    org.springframework.security: DEBUG